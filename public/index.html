<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="style.css">
  <meta name="google-client-id" content="487369731728-9gdcr0t11j92tjdc5aq9tkevjrjtfr27.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Desenho Assinado</h1>
      <p>Entre com sua conta Google e escolha um número entre 1 e 100. O servidor verifica sua identidade e assina o desenho.</p>
    </header>

    <section class="login" aria-labelledby="login-titulo">
      <h2 id="login-titulo">Sua conta Google</h2>
      <div id="google-login"></div>
      <p id="sessao" aria-live="polite">Entre com o Google para gerar seu desenho.</p>
    </section>

    <form id="formulario" novalidate>
      <label for="numero">Número</label>
      <input id="numero" name="numero" type="number" min="1" max="100" step="1" required placeholder="42">
      <button type="submit">Desenhar</button>
    </form>

    <p id="mensagem" role="alert"></p>

    <figure id="desenho" aria-live="polite"></figure>

    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
